<!doctype html>
<html>
    <head>
        <style>
            html,
            body {
                margin: 0;
                overflow: hidden;
                background: transparent;
            }

            canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>

        <script>
            console.log("call");
            setTimeout(() => {
                const canvas = document.getElementById("canvas");

                const viewer = window.createViewer(canvas);
                console.log(viewer);
                viewer.zoom = 0.8;
                viewer.autoRotate = false;
            }, 1000);
        </script>
    </body>
</html>
